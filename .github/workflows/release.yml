name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:single-thread
      - run: npm run typecheck
      - run: npm run build
      - run: npm run release:check
      - name: Verify semantic tag version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be semantic versions without a v prefix: $tag" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          # Obsidian metadata keeps a numeric version; prerelease labels live on the Git tag.
          release_version="${tag%%-*}"
          test "$release_version" = "$package_version"
          test "$release_version" = "$manifest_version"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --verify-tag --generate-notes "${flags[@]}"
